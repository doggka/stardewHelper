<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Макет: Долина</title>
<style>
/* ===== НАПРАВЛЕНИЕ «ДОЛИНА» =====
   Тёплое дерево, пергамент, толстые рамки без скруглений, жёсткие тени.
   Пиксельный шрифт здесь эмулируется: настоящий пришлось бы подключать
   файлом, системного пиксельного в Windows нет. */
:root{
  --wood:#4a3620; --wood2:#3a2a18; --frame:#8a6235; --frame2:#5c3f20;
  --parch:#efdfb8; --parch2:#e3cf9f; --ink:#3a2a16; --dim:#7a6442;
  --gold:#c88a2c; --now:#4e8c3f; --cond:#b8871f; --later:#3f6f9c;
  --last:#c2651c; --past:#a63a2e; --cart:#7a4a9c;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wood);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}

.titlebar{height:38px;background:linear-gradient(180deg,#6b4a28,#4a3620);
  border-bottom:4px solid var(--frame2);display:flex;align-items:center;
  box-shadow:inset 0 2px 0 #8a6235}
.ttl{padding:0 14px;font-size:13px;color:#f3d9a0;font-weight:700;letter-spacing:.6px}
.ttl .sub{color:#c0a173;font-weight:400}
.spacer{flex:1}
.wbtn{width:44px;height:38px;border:0;background:transparent;color:#c0a173;
  font-size:14px;cursor:pointer}
.wbtn:hover{background:#6b4a28;color:#fff}
.wbtn.close:hover{background:#a63a2e;color:#fff}

.shell{height:calc(100% - 38px);overflow:auto}

/* шапка — деревянная вывеска */
header{background:linear-gradient(180deg,#533d23,#43301b);
  border-bottom:4px solid var(--frame2);padding:12px 16px;
  box-shadow:inset 0 2px 0 #8a6235}
h1{margin:0 0 10px;font-size:20px;color:#f3d9a0;letter-spacing:1px;
  text-transform:uppercase;text-shadow:2px 2px 0 #2a1d10}
h1 small{font-size:12px;color:#bb9a68;letter-spacing:0;text-transform:none;font-weight:400}

.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--parch);border:3px solid var(--frame);
  box-shadow:3px 3px 0 #2a1d10;padding:7px 11px;margin:0 0 10px}
.sb-name{font-weight:700;font-size:14px}
.sb-meta{font-size:12.5px;color:var(--dim)}
.sb-sp{flex:1}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{display:flex;gap:5px;align-items:center;background:var(--parch2);
  border:2px solid var(--frame);padding:3px 7px;font-size:13px}
.ctl.grow{flex:1;min-width:170px}
.ctl label{color:var(--dim);font-size:12px}
.num{font-weight:700}
select,input{background:#fff6e0;color:var(--ink);border:2px solid var(--frame2);
  padding:3px 6px;font:inherit;font-size:13px}
button{background:var(--parch2);color:var(--ink);border:2px solid var(--frame);
  padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;
  box-shadow:2px 2px 0 #2a1d10}
button:hover{background:#f6e7c4}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:var(--gold);color:#2a1d10;font-weight:700}
.seg{display:flex}
.seg button{box-shadow:none;border-right:0}
.seg button:last-child{border-right:2px solid var(--frame)}
.cartday{background:#5e3f7e;border:2px solid #8a63ad;color:#f0ddff;
  padding:4px 10px;font-size:12.5px;box-shadow:2px 2px 0 #2a1d10}
.bar{height:12px;background:#2a1d10;border:2px solid var(--frame2);flex:1;min-width:90px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(
  90deg,#6aa84f 0 6px,#5c9444 6px 12px)}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.tabs button small{color:var(--dim);font-weight:400;font-size:11px}
.tabs button.on small{color:#5a4a28}

main{padding:16px;max-width:1200px;margin:0 auto}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.b{font-size:11px;padding:2px 8px;border:2px solid;white-space:nowrap;display:inline-block}
button.b{box-shadow:1px 1px 0 #2a1d10;font:inherit;font-size:11px;cursor:pointer}
.b.now{background:#d8ecd0;border-color:var(--now);color:#27521d}
.b.cond{background:#f6e6bd;border-color:var(--cond);color:#6b4d08}
.b.later{background:#d4e4f3;border-color:var(--later);color:#1e3f5e}
.b.last{background:#f8ddc4;border-color:var(--last);color:#73350a}
.b.past{background:#f3d2cd;border-color:var(--past);color:#6b1f16}
.b.cart{background:#e6d6f3;border-color:var(--cart);color:#43256b}
.b.g{background:#e6dbc2;border-color:#a98f61;color:#5c4a2a}
.b.loc{background:#d2e3ea;border-color:#4d7a93;color:#1d3d4c;cursor:pointer}
.b.gate{background:#f6e2b4;border-color:#9c7a2a;color:#5f420a;cursor:pointer}
.b.sel{box-shadow:0 0 0 2px var(--gold),1px 1px 0 #2a1d10;font-weight:700}
.b.zero{opacity:.4}
.cnt{font-weight:700;margin-left:4px}

.panel{background:var(--parch);border:3px solid var(--frame);
  box-shadow:4px 4px 0 #2a1d10;padding:13px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:16px;color:#6b4a18;
  text-transform:uppercase;letter-spacing:.8px}
.panel h2 em{font-style:normal;font-size:12px;color:var(--dim);
  text-transform:none;letter-spacing:0;font-weight:400}
.room span{font-size:12px;color:var(--dim);font-weight:400;
  text-transform:none;letter-spacing:0}

.flat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--parch2);border:2px solid #c0a173;padding:5px 7px}
.item.ok{background:#d7e7cd;border-color:#8fb382}
.irow{display:flex;gap:7px;align-items:flex-start}
.ipick{display:flex;gap:8px;align-items:flex-start;min-height:24px;flex:1;cursor:pointer}
.ipick input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--now)}
.iname{font-size:13.5px;font-weight:600}
.item.ok .iname{text-decoration:line-through;color:var(--dim)}
.tag{color:var(--dim);font-size:11.5px;font-weight:400}
.dot{padding:0 7px;height:24px;font-size:11px;box-shadow:1px 1px 0 #2a1d10}
.ibody{padding-left:24px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.warn{background:#f6d2cb;border:2px solid var(--past);color:#6b1f16;
  font-size:12px;padding:6px 8px;margin-top:5px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.bundle{background:var(--parch2);border:3px solid var(--frame);
  box-shadow:3px 3px 0 #2a1d10;padding:11px}
.bundle h3{margin:0 0 3px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{font-size:12px;color:var(--dim);margin-bottom:8px}
.items{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
</style>
</head>
<body>
<div id="app"></div>
<script src="_content.js"></script>
<script src="_render.js"></script>
<script>document.getElementById('app').innerHTML = build({ h1: 'Закрыть за первый год' });</script>
</body>
</html>
